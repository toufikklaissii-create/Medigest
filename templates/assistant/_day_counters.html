<div id="day-counters" role="group" aria-label="Activité du jour" {% if oob %}hx-swap-oob="true"{% endif %}
    class="flex flex-wrap items-center gap-x-5 gap-y-1.5">
    <p class="flex items-baseline gap-1.5">
        <span class="text-xl font-bold text-text-main tabular-nums leading-none">{{ count_total }}</span>
        <span class="text-[13px] text-text-muted">RDV du jour</span>
    </p>
    <span class="hidden sm:block h-4 w-px bg-border-strong" aria-hidden="true"></span>
    <p class="flex items-baseline gap-1.5">
        <span class="text-xl font-bold tabular-nums leading-none {% if count_waiting %}text-sky-700{% else %}text-text-main{% endif %}">{{ count_waiting }}</span>
        <span class="text-[13px] text-text-muted">en attente</span>
    </p>
    <span class="hidden sm:block h-4 w-px bg-border-strong" aria-hidden="true"></span>
    <p class="flex items-baseline gap-1.5">
        <span class="text-xl font-bold tabular-nums leading-none {% if count_in_consultation %}text-emerald-700{% else %}text-text-main{% endif %}">{{ count_in_consultation }}</span>
        <span class="text-[13px] text-text-muted">en consultation</span>
    </p>
</div>
