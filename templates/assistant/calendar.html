{% extends "base.html" %}
{% block title %}Planning &amp; agenda — Medigest{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-6 py-7">

    <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
            <h1 class="text-[28px] font-semibold text-text-main tracking-tight leading-tight">Planning &amp; agenda</h1>
            <p class="text-sm text-text-muted mt-1">Vue d'ensemble et gestion des consultations</p>
        </div>
        <div class="flex items-center gap-2">
            <a href="{% url 'appointments:assistant_dashboard' %}"
               class="btn-tactile text-sm font-medium text-text-muted border border-border-subtle rounded-lg px-3 py-2 hover:bg-canvas flex items-center gap-1.5">
                <i data-lucide="layout-list" class="w-4 h-4" stroke-width="1.75"></i> File active du jour
            </a>
            <button type="button"
                    hx-get="{% url 'appointments:appointment_modal' %}?date={{ current_date|date:'Y-m-d' }}"
                    hx-target="#modal-container" hx-swap="innerHTML"
                    class="btn-tactile text-sm font-semibold text-white bg-sauge-600 rounded-lg px-3.5 py-2 shadow-sm hover:bg-sauge-900 flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4" stroke-width="1.75"></i> Nouveau rendez-vous
            </button>
        </div>
    </div>

    {% include "assistant/_calendar_container.html" %}

    <div id="modal-container"></div>
    <div id="drawer-container"></div>
</div>
{% endblock %}
