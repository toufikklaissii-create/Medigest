<div id="tasks-panel" class="flex flex-col gap-2.5">
    {% for task in tasks %}
    <div class="flex items-start gap-2.5 border-b border-border-subtle pb-2.5 last:border-0 hover:bg-canvas -mx-1 px-1 rounded-md transition-colors duration-150">
        <button
            hx-post="{% url 'communications:toggle_task' task.pk %}"
            hx-target="#tasks-panel"
            hx-swap="outerHTML"
            class="btn-tactile -m-2.5 h-10 w-10 shrink-0 rounded-lg flex items-center justify-center group"
            title="Marquer comme terminée" aria-label="Marquer « {{ task.title }} » comme terminée">
            <span class="h-[18px] w-[18px] rounded-md border border-border-subtle flex items-center justify-center group-hover:border-sauge-600 group-hover:bg-sauge-50 transition-colors duration-150">
                <i data-lucide="check" class="w-3 h-3 text-sauge-600 opacity-0 group-hover:opacity-100 transition-opacity duration-150" stroke-width="2.5"></i>
            </span>
        </button>
        <div class="text-sm flex-1 min-w-0">
            <p class="font-medium text-text-main flex items-center gap-1.5">
                {{ task.title }}
                {% if task.priority == "urgent" %}
                <span class="text-[10px] font-semibold uppercase bg-rose-50 text-rose-700 border border-rose-200 rounded-full px-1.5 py-0.5">Urgente</span>
                {% endif %}
            </p>
            {% if task.patient %}<p class="text-xs text-text-muted mt-0.5">{{ task.patient }}</p>{% endif %}
            {% if task.description %}<p class="text-xs text-text-muted mt-0.5">{{ task.description }}</p>{% endif %}
        </div>
    </div>
    {% empty %}
    <div class="flex flex-col items-center justify-center gap-1.5 py-6 text-center">
        <i data-lucide="party-popper" class="w-5 h-5 text-slate-300" stroke-width="1.5"></i>
        <p class="text-sm text-text-muted italic">Aucune tâche active.</p>
    </div>
    {% endfor %}
</div>
