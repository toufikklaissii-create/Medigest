{% extends "base.html" %}
{% block title %}Communications — Medigest{% endblock %}

        <h1 class="font-display text-[28px] font-semibold text-text-main tracking-tight leading-tight">Communications</h1>
        <p class="text-sm text-text-muted mt-1">Consignes et tâches qui vous sont assignées</p>
    </div>

    <div class="bg-surface rounded-2xl border border-border-subtle shadow-card p-5">
