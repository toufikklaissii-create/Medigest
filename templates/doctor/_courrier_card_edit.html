{% comment %}Carte d'un modèle de certificat / courrier en modification.{% endcomment %}
<article id="courrier-{{ modele.pk }}" class="bg-surface rounded-2xl border border-sauge-200 shadow-card p-5">
    <form hx-post="{% url 'clinical:courrier_card' modele.pk %}" hx-target="#courrier-{{ modele.pk }}" hx-swap="outerHTML"
          hx-disabled-elt="find button[type=submit]" x-data="champsInserter()" x-init="$el.querySelector('[name=nom]').focus()"
          @keydown.escape="$refs.cancel.click()" class="space-y-4">
        {% csrf_token %}
        {% include "doctor/_courrier_fields.html" with prefix="edit" pk=modele.pk values=modele %}
        <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
            <label class="inline-flex items-center gap-2 text-[13px] text-text-soft cursor-pointer">
                <input type="checkbox" name="actif" {% if modele.actif %}checked{% endif %} class="size-4 rounded border-border-strong accent-sauge-600">
                Proposer ce modèle en consultation
            </label>
            <div class="flex gap-1.5">
                <button type="button" x-ref="cancel"
                        hx-get="{% url 'clinical:courrier_card' modele.pk %}" hx-target="#courrier-{{ modele.pk }}" hx-swap="outerHTML"
                        class="btn-tactile h-10 rounded-lg px-3.5 text-sm font-medium text-text-soft hover:bg-slate-100/70 hover:text-text-main">
                    Annuler
                </button>
                <button type="submit"
                        class="btn-tactile h-10 inline-flex items-center gap-1.5 rounded-lg bg-sauge-600 px-4 text-sm font-semibold text-white shadow-sm hover:bg-sauge-700 active:scale-[0.98] transition-all duration-150 disabled:opacity-60">
                    <i data-lucide="check" class="w-4 h-4" stroke-width="1.75" aria-hidden="true"></i> Enregistrer
                </button>
            </div>
        </div>
    </form>
</article>
