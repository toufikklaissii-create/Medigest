{% extends "base.html" %}
{% block title %}Nouvelle patiente{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto px-6 py-8">
    <div class="flex items-center gap-2 mb-7">
        <a href="{% url 'patients:index' %}" class="btn-tactile text-text-muted hover:text-sauge-600 hover:bg-sauge-50 p-2 rounded-lg">
            <i data-lucide="arrow-left" class="w-4 h-4" stroke-width="1.75"></i>
        </a>
        <h1 class="text-xl font-bold text-text-main tracking-tight">Nouvelle patiente</h1>
    </div>

    <form method="post" class="bg-surface rounded-xl border border-border-subtle shadow-sm p-6 space-y-3.5">
        {% csrf_token %}
        <div class="grid grid-cols-2 gap-3">
            <input type="text" name="first_name" placeholder="Prénom" required
                   class="rounded-lg border border-border-subtle px-3.5 py-2.5 text-sm transition-colors duration-150 hover:border-sauge-500/50 focus:outline-none focus:ring-2 focus:ring-sauge-500/40 focus:border-sauge-500 placeholder:text-text-muted/60">
            <input type="text" name="last_name" placeholder="Nom" required
                   class="rounded-lg border border-border-subtle px-3.5 py-2.5 text-sm transition-colors duration-150 hover:border-sauge-500/50 focus:outline-none focus:ring-2 focus:ring-sauge-500/40 focus:border-sauge-500 placeholder:text-text-muted/60">
        </div>
        <div class="grid grid-cols-2 gap-3">
            <input type="text" name="cin" placeholder="CIN"
                   class="rounded-lg border border-border-subtle px-3.5 py-2.5 text-sm transition-colors duration-150 hover:border-sauge-500/50 focus:outline-none focus:ring-2 focus:ring-sauge-500/40 focus:border-sauge-500 placeholder:text-text-muted/60">
            <input type="date" name="birth_date"
                   class="rounded-lg border border-border-subtle px-3.5 py-2.5 text-sm transition-colors duration-150 hover:border-sauge-500/50 focus:outline-none focus:ring-2 focus:ring-sauge-500/40 focus:border-sauge-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
            <input type="text" name="phone" placeholder="Téléphone"
                   class="rounded-lg border border-border-subtle px-3.5 py-2.5 text-sm transition-colors duration-150 hover:border-sauge-500/50 focus:outline-none focus:ring-2 focus:ring-sauge-500/40 focus:border-sauge-500 placeholder:text-text-muted/60">
            <input type="text" name="emergency_contact" placeholder="Contact d'urgence"
                   class="rounded-lg border border-border-subtle px-3.5 py-2.5 text-sm transition-colors duration-150 hover:border-sauge-500/50 focus:outline-none focus:ring-2 focus:ring-sauge-500/40 focus:border-sauge-500 placeholder:text-text-muted/60">
        </div>
        <select name="blood_group" class="w-full rounded-lg border border-border-subtle px-3.5 py-2.5 text-sm transition-colors duration-150 hover:border-sauge-500/50 focus:outline-none focus:ring-2 focus:ring-sauge-500/40 focus:border-sauge-500">
            <option value="">Groupe sanguin (optionnel)</option>
            <option value="A+">A+</option><option value="A-">A-</option>
            <option value="B+">B+</option><option value="B-">B-</option>
            <option value="AB+">AB+</option><option value="AB-">AB-</option>
            <option value="O+">O+</option><option value="O-">O-</option>
        </select>
        <textarea name="allergies" rows="2" placeholder="Allergies"
                  class="w-full rounded-lg border border-border-subtle px-3.5 py-2.5 text-sm transition-colors duration-150 hover:border-rose-300 focus:outline-none focus:ring-2 focus:ring-rose-400/40 focus:border-rose-300 placeholder:text-text-muted/60"></textarea>
        <textarea name="medical_history" rows="2" placeholder="Antécédents médicaux"
                  class="w-full rounded-lg border border-border-subtle px-3.5 py-2.5 text-sm transition-colors duration-150 hover:border-sauge-500/50 focus:outline-none focus:ring-2 focus:ring-sauge-500/40 focus:border-sauge-500 placeholder:text-text-muted/60"></textarea>
        <button type="submit" class="btn-tactile w-full bg-sauge-600 text-white text-sm font-semibold rounded-lg py-2.5 shadow-sm hover:bg-sauge-900 flex items-center justify-center gap-2">
            <i data-lucide="user-plus" class="w-4 h-4" stroke-width="1.75"></i> Créer la patiente et prendre RDV
        </button>
    </form>
</div>
{% endblock %}
